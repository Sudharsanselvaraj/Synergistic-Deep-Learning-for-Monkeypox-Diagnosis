name: publish

# Publishes Mpox-Trinet to PyPI. MANUAL trigger (Actions → publish → Run workflow) so it never
# fails automatically before Trusted Publishing is configured. Uses PyPI Trusted Publishing
# (OIDC) — no API token once the trusted publisher is set up at pypi.org (Project → Publishing
# → add this repo + workflow `publish.yml` + environment `pypi`). `skip-existing` makes re-runs
# safe when a version is already on PyPI.

on:
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
