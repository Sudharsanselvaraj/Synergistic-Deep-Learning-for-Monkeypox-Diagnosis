[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trinet"
version = "2.0.0"
description = "Tri-Net v2 — reproducible deep-learning framework for Mpox skin-lesion diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sudharsan S" }]
keywords = ["deep-learning", "medical-imaging", "monkeypox", "mpox", "dermatology", "ensemble"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "tensorflow==2.16.2",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "scipy==1.13.1",
    "pyswarms==1.3.0",
    "xgboost==2.1.1",
    "pillow==10.4.0",
    "opencv-python==4.10.0.84",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "joblib==1.4.2",
    "tqdm==4.66.5",
    "kaggle==2.2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
metal = ["tensorflow-metal==1.1.0"]         # Apple Silicon GPU
dev = ["pytest>=8", "pre-commit>=3.7", "ruff>=0.5"]

[project.scripts]
trinet = "trinet.cli:app"

[project.urls]
Homepage = "https://github.com/Sudharsanselvaraj/Synergistic-Deep-Learning-for-Monkeypox-Diagnosis"
Repository = "https://github.com/Sudharsanselvaraj/Synergistic-Deep-Learning-for-Monkeypox-Diagnosis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
