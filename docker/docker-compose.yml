services:
  trinet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: trinet:0.9.0
    volumes:
      - ../outputs:/app/outputs        # trained weights + generated artifacts
      - ../data:/app/data              # datasets (optional)
    # Run the environment check by default; override with any trinet subcommand, e.g.:
    #   docker compose run --rm trinet predict /app/data/example.jpg
    command: ["doctor"]
